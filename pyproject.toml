[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "ginicast_data"
version = "0.1.0"
description = "GiniCast Phase 1 Data Acquisition & Pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "pandas",
    "pyyaml",
    "python-dotenv",
    "tenacity",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
ginicast-data = "ginicast_data.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ginicast_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]

addopts = "-m 'not live'"
markers = ["live: optional external API calls requiring credentials"]

[tool.ruff.lint]
select = ["E9", "F", "I"]
