version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

  file_handler:
    class: logging.FileHandler
    level: DEBUG
    formatter: standard
    filename: logs/pipeline.log
    mode: a

loggers:
  ginicast_data:
    level: DEBUG
    handlers: [console, file_handler]
    propagate: false

root:
  level: INFO
  handlers: [console]
