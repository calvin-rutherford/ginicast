# sources.yaml
# Defines the API endpoints, rate limit hints, and required environment variables for each source.

sources:
  fred:
    env_vars:
      - FRED_API_KEY
    base_url: "https://api.stlouisfed.org/fred"
    rate_limit_calls: 120
    rate_limit_period_seconds: 60
    enabled: true
  bls:
    env_vars:
      - BLS_API_KEY  # optional, but we will look for it
    base_url: "https://api.bls.gov/publicAPI/v2/timeseries/data/"
    rate_limit_calls: 500  # daily limit w/ token
    rate_limit_period_seconds: 86400
    enabled: true
  census:
    env_vars: []
    base_url: "https://api.census.gov/data"
    enabled: true
  oecd:
    env_vars: []
    base_url: "https://sdmx.oecd.org/public/rest/data"
    enabled: true
  wiid:
    env_vars: []
    base_url: "" # Downloaded manually or via direct zip link
    enabled: true
  manual:
    env_vars: []
    base_url: ""
    enabled: true
